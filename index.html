<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">

        <h1>Buzón CUC Escucha</h1>

        <p>
            Comparte tus ideas para mejorar la experiencia estudiantil en la Universidad de la Costa.
        </p>

        <form>

            <label>Nombre</label>
            <input type="text" required>

            <label>Correo Institucional</label>
            <input type="email" required>
            <label>Semestre</label>
            <input type="number" min="1" max="10">
            <label>Categoría</label>
            <select>
                <option>Bienestar</option>
                <option>Servicios</option>
                <option>Clases</option>
                <option>Inclusión</option>
                <option>Espacios</option>
                <option>Procesos Académicos</option>
            </select>

            <label>Sugerencia</label>
            <textarea rows="5"></textarea>

            <button type="submit">Enviar</button>

        </form>

    </div>

</body>
</html>
